<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <title>Document</title>
</head>

<body>
    <div id="app">
        <a :href="google">Go to Google</a>

        <hr />

        <button v-on:click="alertSomething">Alert Something</button>
    </div>
</body>
<script>
    const { createApp, ref, reactive, watch } = Vue;

    createApp({
        setup() {
            const google = ref('http://google.com');

            const alertSomething = () => {
                alert('Hello King!');
            }

            return { google, alertSomething };
        }
    }).mount('#app');
</script>

</html>
