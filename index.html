<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <title>Document</title>
</head>

<body>
    <div id="app">
        <label>
            Name
        </label>
        <input v-model="userData.name" type="text">
        <button v-on:click="toggleActive">Toggle Active</button>
        <hr />
        {{ message }}
        {{ isActive }}

    </div>
</body>
<script>
    const { createApp, ref, computed } = Vue;

    createApp({
        setup() {
            let userData = ref({
                name: '',
                active: false,
            });

            const message = computed(() => {
                console.log('GET MESSAGE');
                return userData.value.name === 'dean' ? 'Hello Dean!' : 'Not Allowed';
            });

            const isActive = computed(() => {
                return userData.value.active ? 'Active' : 'Not Active';
            });


            function toggleActive() {
                console.log('TOGGLE ACTIVE');
                userData.value.active = !userData.value.active;
            }


            return { userData, toggleActive, message, isActive };
        }
    }).mount('#app');
</script>

</html>
