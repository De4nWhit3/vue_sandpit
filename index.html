<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <title>Document</title>
</head>

<body>
    <div id="app">
        <h1>{{count.number}}</h1>
        <button v-on:click="count.number++">INCREMENT</button>
    </div>
</body>
<script>
    const { createApp, ref, watch, reactive } = Vue;

    createApp({
        setup() {
            let count = reactive({
                number: 0,
                other: 'other'
            });

            // callback/getter to get number from 'complex' object
            watch(() => [count.number, count.other], (newCount, oldCount) => {
                console.log(`New: ${newCount}, Old: ${oldCount}`);
            });

            return { count };
        }
    }).mount('#app');
</script>

</html>
