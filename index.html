<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <title>Document</title>
    <style>
        .red {
            background: red;
        }

        .green {
            background: green;
        }

        .blue {
            background: blue;
        }

        #block {
            height: 200px;
            width: 200px;
            border: 2px solid black;
        }

        .btn {
            height: 100px;
            width: 200px;
            border: 2px solid black;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="block" v-bind:class="[
            colors.redClass.active ? 'red': '',
            colors.greenClass.active ? 'green' : '',
            colors.blueClass.active ? 'blue' : ''
        ]">

        </div>
        <hr />
        <div class="btn" v-on:click="toggleColor">
            TOGGLE COLOR
        </div>
        <hr />
        <div class="btn" v-on:click="makeBlue">
            MAKE BLUE
        </div>
    </div>
</body>
<script>
    const { createApp, ref } = Vue;

    createApp({
        setup() {
            let colors = ref({
                redClass: {
                    name: 'red',
                    active: true
                },
                greenClass: {
                    name: 'green',
                    active: 'false'
                },
                blueClass: {
                    name: 'blue',
                    active: false
                }
            });

            function toggleColor() {
                colors.value.blueClass.active = false;
                colors.value.greenClass.active = !colors.value.greenClass.active;
            }

            function makeBlue() {
                colors.value.blueClass.active = true;
            }

            return { colors, toggleColor, makeBlue };
        }
    }
    ).mount('#app');
</script>

</html>
