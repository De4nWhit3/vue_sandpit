<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <title>Document</title>
</head>

<body>
    <div id="app">
        <form v-on:submit.prevent="formHandler">
            <label>name:</label>
            <input type="text" v-model.trim="formData.name">
            <hr />

            <label>surname:</label>
            <input type="text" v-model.trim="formData.surname">
            <hr />

            <label>age:</label>
            <input type="text" v-model.number="formData.age">

            <hr />

            <label>checked:</label>
            <input type="checkbox" v-model="formData.checked">
            <h3>{{formData.checked}}</h3>

            <button type="submit">
                SUBMIT
            </button>
        </form>
    </div>
</body>
<script>
    const { createApp, ref } = Vue;

    createApp({
        setup() {
            const formData = ref({
                name: '',
                surname: '',
                age: '',
                checked: false
            });

            function formHandler() {
                console.log(formData);
            }

            return { formData, formHandler };
        }

    }).mount('#app');
</script>

</html>
