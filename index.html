<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <title>Document</title>
</head>

<body>
    <div id="app">
        <h1>{{user.age}}</h1>
    </div>
</body>
<script>
    const { createApp, ref, reactive } = Vue;

    createApp({
        setup() {
            let user = reactive({ age: 10 });

            setTimeout(
                () => {
                    user.age = 33;
                }, 2000
            );

            return { user };
        }
    }).mount("#app");
</script>

</html>
